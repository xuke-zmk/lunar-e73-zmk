# ===========================================================================
# Lunar Dust (shield `paw`) — 原有配置，保持不变
# ===========================================================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# CONFIG_BT_BUF_ACL_TX_COUNT=32
# CONFIG_BT_L2CAP_TX_BUF_COUNT=32
# CONFIG_ZMK_BEHAVIOR_TOGGLE_IO=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y


CONFIG_ZMK_STUDIO_LOCKING=n

## test sleep time
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=6000

# Turn on logging, and set ZMK logging to debug output
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000


# ===========================================================================
# DYA Studio — Level 2 基线
# https://studio.dya.cormoran.works/developer-guide/level-2
#
# 下面这一组是「同时启用多个 Custom Studio Protocol 模块」时的推荐栈/缓冲值。
# 这些值就是开发者指南 Level 2 页给的那一组（我对照过 DYA2 出厂 conf，完全一致）。
# 指南同时警告：不要盲目照抄 DYA2 的其它参数，内存吃紧时要一边实机验证一边下调。
# 若出现反复重启/卡死，优先怀疑 stack overflow，然后逐步调小这些值。
# ===========================================================================
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# 指南和 DYA2 用的是 10000（最快 10 秒落盘）。这里先用 ZMK 默认值 60000，
# 也就是你**原来那版固件**用的值——目的是把"变量"减到最少：
# 现在的配置相对你原来那版，差异只剩 DYA 功能本身。
# 等卡顿问题彻底确认解决后，想改成 10000 再说（代价是 flash 擦写更频繁，
# nRF52840 每次擦除约 85ms 且会阻塞 CPU 和 BLE）。
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
# 这一项和 zmk-feature-kscan-diagnostics 有关系，别往下调：
# 该模块的 include/cormoran/kscan_diagnostics/relay_events.h 里有一条
#   BUILD_ASSERT(sizeof(struct ksd_relay_reply) <= CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN)
# sizeof 是 1+1+1+192 = 195 字节，240 >= 195，所以指南给的这个值能过。
# 如果构建真的报那条 assert（提示要 256），把这里改成 256 即可。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# ---------------------------------------------------------------------------
# 核心模块：下面所有功能模块都依赖它们
# ---------------------------------------------------------------------------
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
# ZMK_FAST_KEYMAP_DEFAULT_LAYER 依赖 ZMK_KEYMAP_SETTINGS_STORAGE，
# 而后者由 ZMK_STUDIO_RPC 自动 select（见 app/src/studio/Kconfig），
# 所以在中央侧（左半）这一行是生效的；外周侧本来就没有 ZMK_STUDIO_RPC，无需它。
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

# ---------------------------------------------------------------------------
# Keymap / Macro / Combo
#
# !! 注意：这里**没有** CONFIG_ZMK_STUDIO，这是故意的，别加回来。
#
# ZMK 只在 CONFIG_ZMK_STUDIO_RPC=y 时才生成 proto/zmk/*.pb.h
#（见 zmk/app/CMakeLists.txt 第 113 行 `if (CONFIG_ZMK_STUDIO_RPC)`），
# 而 ZMK 里那条 select 是：
#     select ZMK_STUDIO_RPC if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL
# 所以**外周侧（右半）永远没有 ZMK Studio RPC，也没有那些 .pb.h**。
#
# 本文件对两半都生效。一旦在这里写 CONFIG_ZMK_STUDIO=y，
# 外周侧的 ZMK_FAST_KEYMAP_STUDIO_RPC / ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC
# 等（它们只 depends on ZMK_STUDIO）就会变成 y，模块于是去编译 src/studio/*.c，
# 然后因为找不到 proto/zmk/custom.pb.h 而编译失败。
#（2026-10-02 第二次 CI 失败就是这么来的。）
#
# 所以 ZMK_STUDIO 写在 config/paw_left.conf（只对左半生效），
# 和 DYA2 出厂配置的做法一致：dya2_right.conf（中央）有 ZMK_STUDIO，
# dya2_left.conf（外周）46 行里一行都没有。
#
# 副作用：下面那些 CONFIG_*_STUDIO_RPC=y 在外周侧会因为依赖不满足而静默变 n，
# Kconfig 可能会打几条 "was assigned the value 'y' but got the value 'n'" 的
# 警告。那只是噪音，不影响构建，也不影响右半的功能。
# ---------------------------------------------------------------------------
# !! CONFIG_ZMK_RUNTIME_MACRO / CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16 /
#    CONFIG_ZMK_RUNTIME_COMBO 也都挪到 config/paw_left.conf 了。
#
#    原因是 ZMK 的 app/CMakeLists.txt 第 48 行：
#        if ((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)
#            ... src/keymap.c
#            ... src/events/layer_state_changed.c
#            ... src/events/keycode_state_changed.c
#    也就是说 **split 外周侧根本不编译 keymap.c 和这些事件**——外周侧没有
#    键盘映射、没有层状态。而这三个模块的**非 studio 部分**引用了它们：
#
#      runtime-combo          -> zmk_keymap_highest_layer_active,
#                                as_zmk_keycode_state_changed, zmk_behavior_invoke
#      runtime-macro          -> zmk_behavior_queue_*
#      runtime-input-processor-> as_zmk_layer_state_changed,
#                                as_zmk_keycode_state_changed, zmk_hid_*, zmk_keymap_*
#
#    在外周侧打开它们就会在**链接阶段**报 undefined reference。
#   （2026-10-02 第三次 CI 失败就是这个。）
#
#    这是 ZMK 的设计：外周侧只负责扫描按键并把位置事件发给中央侧，
#    键位解析、层、宏、组合键全部由中央侧执行。DYA2 的外周侧配置里
#    这三个模块也**一个都没开**。
# ---------------------------------------------------------------------------
# 实时显示按下的键
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
# 在 Studio 的键盘图上画出轨迹球/旋钮
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# ---------------------------------------------------------------------------
# Trackball（PAW3222）
#
# 这里只启用 runtime input processor：灵敏度、旋转、轴反转、惯量、生效层、
# 临时换层等，这些是传感器无关的，PAW3222 一样能用。
# 指南 Trackball 页里的 zmk-driver-pmw3610-with-custom-studio-rpc 是 PMW3610
# 专用（CPI / 省电设置等），本键盘是 PAW3222，所以不装，也就没有那部分 UI。
# ---------------------------------------------------------------------------
CONFIG_ZMK_POINTING=y
# !! CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR 也挪到 config/paw_left.conf 了。
#    它的 input_processor_runtime.c 引用 as_zmk_layer_state_changed /
#     as_zmk_keycode_state_changed / zmk_keymap_*，而 split 外周侧不编译
#     keymap.c 和那些事件（见上面 Macro/Combo 段的说明），在外周侧开会链接失败。
#
#    本键盘右半的轨迹球是经 &pmw_split { device = <&trackball>; } 把**原始事件**
#    转发给中央侧的，processor 挂在中央侧的 pmw_listener 上，
#    所以外周侧本来也不需要这个模块。

# ---------------------------------------------------------------------------
# Connection（BLE 配置管理 / 按 OS 自动切层）
# ---------------------------------------------------------------------------
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
# 当前 config/paw.keymap 只有 2 层（default_layer / lower_layer），
# 所以上限只能是 1。想开放更多层，先在 keymap 里加层，再把这个值调大，
# 而且 MAX_INDEX 必须 < 实际层数。
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# !! CONFIG_ZMK_OS_DETECTION* 也**不能**放在这里（两半共用），已挪到
#    config/paw_left.conf。原因不是 nanopb，而是 os-detection 模块的
#    CMakeLists.txt 里有一条 message(FATAL_ERROR)：
#
#      if(CONFIG_ZMK_OS_DETECTION_USB)
#          if(NOT CONFIG_USB_DEVICE_STACK)
#              message(FATAL_ERROR "ZMK_OS_DETECTION_USB observes USB
#              enumeration by linker-wrapping usb_handle_bos(), ...")
#
#    而 ZMK 里 ZMK_USB 是
#      depends on (!ZMK_SPLIT || (ZMK_SPLIT && ZMK_SPLIT_ROLE_CENTRAL))
#    → 外周侧没有 USB 栈 → USB_DEVICE_STACK=n → 一旦在两半共用配置里写
#      CONFIG_ZMK_OS_DETECTION_USB=y，右半就会 **直接中止构建**。
#
#    而且 OS detection 本来就是给中央侧用的（检测主机是 Windows/macOS/Linux），
#    DYA2 也是只放在中央侧的 conf 里。

# ---------------------------------------------------------------------------
# Battery（让中央侧能看到右半的电量）
#
# DYA Studio 的 Troubleshooting 页号称能看「两半的电池」。
# 电量本身由 ZMK_BLE imply 出的 ZMK_BATTERY_REPORTING 提供，
# 但中央侧**默认不会去取外周侧的电量**——这两个开关都没有 default（即默认 n），
# 必须显式打开。DYA2 的出厂 conf 里也开着这两个。
# 不打开的话 DYA Studio 里只能看到左半（中央侧）自己的电量。
# ---------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ---------------------------------------------------------------------------
# Settings（休眠时间等）
# ---------------------------------------------------------------------------
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# ---------------------------------------------------------------------------
# Diagnostics（Device Info / Watchdog / KSCAN / Devtool）
#
# 安全注意：参考实现刻意保持 Devtool 的侵入性功能关闭
#（key injection / event tap / log capture），这里只暴露状态类信息。
# 如果这个固件要对外发布，请再确认一次要公开的诊断项。
# ---------------------------------------------------------------------------
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# !! 这一行是修「按十几下就卡顿几秒」的关键，别删。
#
# zmk-feature-watchdog 的 Kconfig 原文（第 124-133 行）：
#     config ZMK_WATCHDOG_FREEZE_DETECT
#         default y
#         select TASK_WDT
#         help
#           Monitors the system workqueue (and the ZMK low-priority workqueue) with
#           one task_wdt channel each, fed by a self-rescheduling k_work_delayable
#           on the monitored queue itself. If a queue is blocked longer than
#           CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS, the feed work never runs and the
#           channel's callback records a FREEZE incident **and reboots**.
#
# 它的默认值是 y，会把 Zephyr 的 TASK_WDT 拉进来，然后以
# 「超时 10000ms ÷ 喂食除数 2 = 每 5 秒喂一次」的节奏盯着 sysworkq 和
# ZMK 低优先级队列；一旦某条队列被堵住超过 10 秒，**直接复位整块板子**。
# 那几秒"卡顿"就是复位 + BLE 重连的时间。
#
# Kconfig 自己也提醒过："Keep this well above worst-case legitimate stalls
# (BLE connection storms, ...)"。
#
# 关掉它之后**还剩**这些（都有价值，且都不会复位）：
#   - ZMK_WATCHDOG_FATAL_DETECT（默认 y）：抓 HardFault / 栈溢出 / panic，
#     走的是 k_sys_fatal_error_handler，不依赖 TASK_WDT
#   - watchdog_reset_cause.c：开机用 hwinfo 审计复位原因
#     （Device Info 里那行 Reset Cause 就是它）
#   - 事件存储 + Studio RPC：Troubleshooting 页的 Watchdog 一节照常工作
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n

CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y

# Zephyr Setting Expose：让网页列出/读取/写入/删除设备上的 Zephyr settings。
# 这是破坏性能力（可以清掉你的设置），而你保留了 ZMK_STUDIO_LOCKING=n，
# 所以默认关闭。要开就同时放开 config/west.yml 里对应的 project 和这两行。
# 开启后 ZMK_SETTING_EXPOSE_SPLIT 会自动变成 y（两半都编译 relay + NANOPB）。
# CONFIG_ZMK_SETTING_EXPOSE=y
# CONFIG_ZMK_SETTING_EXPOSE_SPLIT=y
