# ===========================================================================
# 【2026-10-03 完整版】把排查期间关掉的功能加回来
#
# 基线：nomgmt 版已被实机确认可用（不崩 / 外围侧可读 / 左右手打字正常）。
# 崩溃真因是「分体链路不通 -> 中央侧无休止扫描重连」，与底灯无关
#（关底灯曾让频率下降 30 倍，但那是和「删掉主机蓝牙配对」一起改的，
#  两个变量同时动，归因不严谨）。所以这里把功能逐个加回来；
# 若加回后又崩，就按①底灯 ②kscan/devtool ③外周电量代理 逐项二分。
# ===========================================================================
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_DEVTOOL=y
