CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# ===========================================================================
# DYA Studio：Studio 相关配置只能放在**中央侧（左半）**
#
# ZMK 只在 CONFIG_ZMK_STUDIO_RPC=y 时才生成 proto/zmk/*.pb.h
#（zmk/app/CMakeLists.txt 第 113 行 `if (CONFIG_ZMK_STUDIO_RPC)`），
# 而 ZMK 里那条 select 是：
#     select ZMK_STUDIO_RPC if !ZMK_SPLIT || ZMK_SPLIT_ROLE_CENTRAL
# 所以**外周侧（右半）永远没有 ZMK Studio RPC，也没有那些 .pb.h**。
#
# config/paw.conf 是对两半都生效的。如果在那里写 CONFIG_ZMK_STUDIO=y，
# 外周侧的 ZMK_FAST_KEYMAP_STUDIO_RPC / ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC
# 等（它们只 depends on ZMK_STUDIO）就会变成 y，模块于是去编译 src/studio/*.c，
# 然后因为找不到 proto/zmk/custom.pb.h 而报：
#     fatal error: proto/zmk/custom.pb.h: No such file or directory
#（2026-10-02 第二次 CI 失败就是这个。）
#
# 所以它写在这里——本文件按 ZMK 的规则只对 shield paw_left 生效。
#（ZMK 的 config 目录匹配顺序是 paw.conf 在前、paw_left.conf 在后，后者覆盖前者。）
#
# DYA2 的真实出厂配置也是同样做法：dya2_right.conf（中央侧）里有
# CONFIG_ZMK_STUDIO=y，而 dya2_left.conf（外周侧）46 行里一行都没有。
# ===========================================================================
CONFIG_ZMK_STUDIO=y

# ---------------------------------------------------------------------------
# OS detection 同样只能放中央侧
#
# 不只是"没必要"——放在两半共用配置里会**直接中止外周侧构建**：
#   zmk-feature-os-detection/CMakeLists.txt
#     if(CONFIG_ZMK_OS_DETECTION_USB)
#         if(NOT CONFIG_USB_DEVICE_STACK)
#             message(FATAL_ERROR "ZMK_OS_DETECTION_USB observes USB enumeration
#             by linker-wrapping usb_handle_bos(), ...")
#
# 而 ZMK 的 ZMK_USB 是
#   depends on (!ZMK_SPLIT || (ZMK_SPLIT && ZMK_SPLIT_ROLE_CENTRAL))
# → 外周侧没有 USB 设备栈 → USB_DEVICE_STACK=n → 触发上面那条 FATAL_ERROR。
#
# 语义上也对：OS detection 是检测"主机是哪个系统"，本来就是中央侧的事。
# DYA2 也只把它放在中央侧的 conf 里。
# ---------------------------------------------------------------------------
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

# ===========================================================================
# 运行时宏 / 组合键 / 轨迹球 runtime input processor：也只能放中央侧
#
# ZMK 的 app/CMakeLists.txt 第 48 行：
#     if ((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)
#         ... src/keymap.c
#         ... src/events/layer_state_changed.c
#         ... src/events/keycode_state_changed.c
#         ... src/behaviors/* ，等等
# **split 外周侧不编译 keymap.c 和这些事件**——外周侧没有键盘映射、没有层状态。
#
# 而这三个模块的**非 studio 部分**引用了那些符号，在外周侧打开会在
# 链接阶段报 undefined reference（2026-10-02 第三次 CI 失败）：
#     runtime-combo           -> zmk_keymap_highest_layer_active
#                                as_zmk_keycode_state_changed, zmk_behavior_invoke
#     runtime-macro           -> zmk_behavior_queue_*
#     runtime-input-processor -> as_zmk_layer_state_changed,
#                                as_zmk_keycode_state_changed, zmk_hid_*, zmk_keymap_*
#
# 这也是 ZMK 的设计本意：外周侧只扫描按键、把位置事件发给中央侧；
# 键位解析、层、宏、组合键全部由中央侧执行。
# DYA2 的外周侧配置里这三个模块一个都没开，完全一致。
#
# 轨迹球那边也一样：右半的轨迹球是经
#     &pmw_split { device = <&trackball>; }
# 把**原始事件**直接转发到中央侧的，processor 挂在中央侧的 pmw_listener 上，
# 所以外周侧本来就不需要这个模块。
# ===========================================================================
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# 行为本地 ID 改用 CRC16 生成，这样重编译固件后运行时宏/组合键仍然认得原来的键。
# （来自 zmk-feature-runtime-macro 的 README，DYA2 出厂 conf 里也有这一行。）
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ---------------------------------------------------------------------------
# 【临时诊断】关闭外周电量获取与代理
#
# 原因：CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y 时，中央侧会把
# **外周侧（右半）的电量**代理上报给主机。所以 Windows 里看到的百分比
# 可能是右半的。而分体链路不稳时取不回外周电量，主机就会一直显示 0%，
# 让人误以为中央侧的 ADC 有问题。
#
# 把这两个关掉之后，主机显示的就是【中央侧自己测到】的电量，
# 这样才能判断中央侧的 ADC 到底工作不工作。
# 预期：分压点 2.5~2.69V -> 电池 3.5~3.77V -> 8%~44% 之间的某个非零值。
# ---------------------------------------------------------------------------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ===========================================================================
# 【2026-10-03 修复尝试】BLE 管理模块移到这里（原来在 paw.conf，两个半边都开）
#
# zmk-module-ble-management 管理的是【主机蓝牙连接】（配对列表、输出优先级、
# 解除配对、管理分体连接）—— 全是中央侧的事。
# 外周侧跑它没有意义，而且可能改变外周侧的广播/连接行为，
# 于是左右手之间的链路就建不起来（现象：右手永远不触发、
# DYA Studio 的「外围侧」一直是 did not respond）。
#
# 对照 DYA2 官方出厂配置：中央侧 conf 里有一堆功能模块，
# 外周侧 conf（dya2_left.conf，46 行）里一行都没有。
# ===========================================================================
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
