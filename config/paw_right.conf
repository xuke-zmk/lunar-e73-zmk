# ===========================================================================
# 只作用于【右半 / 外周侧】的配置
#
# 背景：分体链路的收发缓冲被压在最小值，而 DYA 的分体中继单次要传 240 字节
#   CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN = 240
#
# 对比两个半边生成的实际 .config，外周侧明显偏小：
#   CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA   中央=6   外周=1
#   CONFIG_BT_CONN_TX_MAX              中央=64  外周=3
#   CONFIG_BT_ATT_TX_COUNT             中央=10  外周=3
#   CONFIG_BT_CONN_FRAG_COUNT          中央=6   外周=1
#   CONFIG_BT_CTLR_LLCP_CONN           中央=6   外周=1
#
# 接收缓冲不足时，外周侧来不及收完一次中继事件，链路就会超时/断开，
# 表现就是「右手按键不触发」+「外围侧 did not respond」。
#
# 这里把外周侧提到和中央侧相当，代价是几百字节 RAM（右半 RAM 用量约 57%）。
# ===========================================================================

CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6
CONFIG_BT_CONN_TX_MAX=64
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_FRAG_COUNT=6
CONFIG_BT_CTLR_LLCP_CONN=6
